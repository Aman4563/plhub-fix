<!-- HTML Code to Test Authentication Functionalities -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication Testing</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://apis.google.com/js/platform.js" async defer></script>
    <script>
        var googleClientId = '903318278374-2hb3n40a8n5r3hieg5f2nehf70cn90ee.apps.googleusercontent.com';
    </script>
</head>
<body>
    <div class="container">
        <h2>Signup</h2>
        <div id="signup">
            <input type="text" id="signup-username" placeholder="Username">
            <input type="email" id="signup-email" placeholder="Email">
            <input type="password" id="signup-password" placeholder="Password">
            <input type="password" id="signup-confirm-password" placeholder="Confirm Password">
            <input type="text" id="signup-display-name" placeholder="Display Name">
            <div id="signup-captcha"></div>
            <button onclick="handleSignup()">Signup</button>
        </div>

        <h2>Signin</h2>
        <div id="signin">
            <input type="text" id="signin-username" placeholder="Username">
            <input type="password" id="signin-password" placeholder="Password">
            <div id="signin-captcha"></div>
            <button onclick="handleSignin()">Signin</button>
        </div>

        <h2>Google Signin</h2>
        <div id="gSignInWrapper">
            <div id="my-signin2"></div>
        </div>
    </div>

    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <script src="script.js"></script>
</body>
</html>

<!-- CSS Code (styles.css) -->
<style>
    body {
        font-family: Arial, sans-serif;
        background-color: #f0f0f0;
        color: #333;
        padding: 20px;
    }

    .container {
        max-width: 400px;
        margin: auto;
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.1);
    }

    input[type="text"], input[type="email"], input[type="password"] {
        width: 100%;
        padding: 10px;
        margin: 8px 0;
        border: 1px solid #ccc;
        border-radius: 4px;
    }

    button {
        width: 100%;
        padding: 10px;
        background-color: #28a745;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
    }

    button:hover {
        background-color: #218838;
    }
</style>

<!-- JavaScript Code (script.js) -->
<script>
    const backendUrl = 'http://localhost:8000/api/v1';

    function handleSignup() {
        const username = document.getElementById('signup-username').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;
        const confirmPassword = document.getElementById('signup-confirm-password').value;
        const displayName = document.getElementById('signup-display-name').value;
        const captchaToken = grecaptcha.getResponse();

        if (!captchaToken) {
            alert('Please complete the CAPTCHA');
            return;
        }

        fetch(`${backendUrl}/signup`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username,
                email,
                password,
                confirmPassword,
                displayName,
                captchaToken
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 201) {
                alert('Signup successful!');
            } else {
                alert('Signup failed: ' + data.message);
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function handleSignin() {
        const username = document.getElementById('signin-username').value;
        const password = document.getElementById('signin-password').value;
        const captchaToken = grecaptcha.getResponse();

        if (!captchaToken) {
            alert('Please complete the CAPTCHA');
            return;
        }

        fetch(`${backendUrl}/signin`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                username,
                password,
                captchaToken
            })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 201) {
                alert('Signin successful!');
            } else {
                alert('Signin failed: ' + data.message);
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function onGoogleSignIn(googleUser) {
        const tokenId = googleUser.getAuthResponse().id_token;
        fetch(`${backendUrl}/google-signin`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ tokenId })
        })
        .then(response => response.json())
        .then(data => {
            if (data.status === 200) {
                alert('Google Signin successful!');
            } else {
                alert('Google Signin failed: ' + data.message);
            }
        })
        .catch(error => console.error('Error:', error));
    }

    function renderGoogleButton() {
        gapi.signin2.render('my-signin2', {
            'scope': 'profile email',
            'width': 240,
            'height': 50,
            'longtitle': true,
            'theme': 'dark',
            'onsuccess': onGoogleSignIn,
            'onfailure': onGoogleSignIn
        });
    }

    window.onload = function() {
        renderGoogleButton();
    };
</script>
